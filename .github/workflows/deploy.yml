name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://post-training.win
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage public files
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.*' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='scripts/' \
            --exclude='playwright-report/' \
            --exclude='test-results/' \
            --exclude='*.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='playwright.config.ts' \
            --exclude='eslint.config.js' \
            --exclude='tsconfig.json' \
            --exclude='ruff.toml' \
            --exclude='serve.json' \
            ./ _site/
          test -f _site/index.html
          test -f _site/privacy.html
          test -f _site/_headers
          test -f _site/puzzles.json
          test -f _site/models/Xenova/albert-base-v2/onnx/model_fp16.onnx

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.146.0'
          command: pages deploy _site --project-name=post-training --branch=main
